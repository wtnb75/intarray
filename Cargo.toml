[package]
name = "intarray"
version = "0.3.0"
authors = ["Watanabe Takashi <wtnb75@gmail.com>"]
edition = "2021"
rust-version = "1.87"
repository = "https://github.com/wtnb75/intarray"
keywords = ["array", "memory"]
license-file = "LICENSE"
readme = "README.md"
description = "memory efficient integer array"

[dependencies]
serde = "1"
env_logger = "0.11"
log = "0.4"
rand = "0.8"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

[dev-dependencies]
test-log = { version = "0.2", features = ["env_logger"] }
serde_json = "1"
serde_derive = "1"
serde_yaml = "0.9"
clap = "4"
sha2 = "0.10"
digest = "0.10"
hex = "0.4"

[[example]]
name = "bench"
